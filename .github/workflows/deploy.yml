name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: 设置 Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 部署到 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # 部署目标分支
          folder: dist # 构建输出目录
          clean: true # 自动清理旧文件
          single-commit: true # 减少 commit 历史，让分支更干净
          commit-message: 自动部署 # 自定义 commit message
